# Installed on: https://github.com/balukasagatta/Pocket-Contacts-Pro_devops
# Path: .github/workflows/trigger-pocket-build.yml
#
# Notifies balukasagatta/pocket-build via repository_dispatch so CI builds
# THIS fork at the triggering SHA and uploads the Simulator .app artifact.
#
# Secret: POCKET_BUILD_TOKEN — GitHub PAT with repo + workflow on pocket-build
# Variable: POCKET_BUILD_REPO — balukasagatta/pocket-build

name: Trigger pocket-build

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  dispatch:
    name: Notify pocket-build
    runs-on: ubuntu-latest
    steps:
      - name: Send repository_dispatch to pocket-build
        env:
          POCKET_BUILD_TOKEN: ${{ secrets.POCKET_BUILD_TOKEN }}
          POCKET_BUILD_REPO: ${{ vars.POCKET_BUILD_REPO || 'balukasagatta/pocket-build' }}
          POCKET_BUILD_API: ${{ vars.POCKET_BUILD_API || 'https://api.github.com' }}
        run: |
          set -euo pipefail

          if [ -z "${POCKET_BUILD_TOKEN:-}" ]; then
            echo "::error::Missing secret POCKET_BUILD_TOKEN"
            exit 1
          fi

          IOS_REPO="${GITHUB_REPOSITORY}"
          IOS_REF="${GITHUB_SHA}"
          DISPATCH_URL="${POCKET_BUILD_API}/repos/${POCKET_BUILD_REPO}/dispatches"

          echo "Dispatching pocket-ios-build"
          echo "  target: ${POCKET_BUILD_REPO}"
          echo "  url: ${DISPATCH_URL}"
          echo "  ios_repo: ${IOS_REPO}"
          echo "  ios_ref: ${IOS_REF}"

          PAYLOAD=$(jq -n \
            --arg event_type "pocket-ios-build" \
            --arg ios_repo "${IOS_REPO}" \
            --arg ios_ref "${IOS_REF}" \
            --arg sha "${GITHUB_SHA}" \
            --arg source_repo "${GITHUB_REPOSITORY}" \
            --arg source_run "${GITHUB_RUN_ID}" \
            '{
              event_type: $event_type,
              client_payload: {
                ios_repo: $ios_repo,
                ios_ref: $ios_ref,
                sha: $sha,
                source_repo: $source_repo,
                source_run_id: $source_run
              }
            }')

          HTTP_CODE=$(curl -sS -o /tmp/dispatch-body.txt -w "%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${POCKET_BUILD_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            "${DISPATCH_URL}" \
            -d "${PAYLOAD}")

          echo "HTTP ${HTTP_CODE}"
          cat /tmp/dispatch-body.txt || true
          echo

          case "${HTTP_CODE}" in
            200|204)
              echo "Dispatch accepted."
              echo "Open https://github.com/${POCKET_BUILD_REPO}/actions for iOS CI / artifact."
              ;;
            404)
              echo "::error::HTTP 404 from dispatch URL. Check POCKET_BUILD_REPO exists on GitHub and the PAT can access it."
              exit 1
              ;;
            *)
              echo "::error::Dispatch failed with HTTP ${HTTP_CODE}"
              exit 1
              ;;
          esac
