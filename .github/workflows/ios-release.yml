name: iOS Release

on:
  workflow_dispatch:
    inputs:
      export_method:
        description: "Export method"
        required: true
        default: ad-hoc
        type: choice
        options:
          - ad-hoc
          - app-store
          - development
          - enterprise
      skip_codesigning:
        description: "Skip codesigning (simulator/debug only — not for distribution)"
        required: false
        default: false
        type: boolean

concurrency:
  group: ios-release-${{ github.ref }}
  cancel-in-progress: false

env:
  DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer

jobs:
  release:
    name: Archive Release
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d "${DEVELOPER_DIR}" ]; then
            sudo xcode-select -s "${DEVELOPER_DIR}"
          fi
          xcodebuild -version

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Install pods
        run: bundle exec pod install

      - name: Import signing certificate
        if: ${{ inputs.skip_codesigning != true }}
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${BUILD_CERTIFICATE_BASE64:-}" ]; then
            echo "::error::Missing secret BUILD_CERTIFICATE_BASE64. Add signing secrets or re-run with skip_codesigning."
            exit 1
          fi

          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          PP_PATH="$RUNNER_TEMP/build_pp.mobileprovision"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          if [ -n "${BUILD_PROVISION_PROFILE_BASE64:-}" ]; then
            echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"
            mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
            cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/"
          fi

      - name: Fastlane release
        env:
          EXPORT_METHOD: ${{ inputs.export_method }}
          SKIP_CODESIGNING: ${{ inputs.skip_codesigning && '1' || '0' }}
        run: bundle exec fastlane release

      - name: Upload IPA / archive artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
