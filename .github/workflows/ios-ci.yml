name: iOS CI

# Triggers:
# - push/PR in this pipeline repo (pocket-build)
# - manual Run workflow (optional ios_repo / ios_ref)
# - repository_dispatch from the pocket container / iOS repo (type: pocket-ios-build)
on:
  push:
    branches: [main, master, "cursor/**"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      ios_repo:
        description: "iOS source repo (owner/name or https URL)"
        required: false
        default: "balukasagatta/Pocket-Contacts-Pro_devops"
      ios_ref:
        description: "Branch, tag, or SHA of the iOS repo"
        required: false
        default: "main"
  repository_dispatch:
    types: [pocket-ios-build]

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.event.client_payload.sha || github.sha }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEME: Pocket Contacts Pro
  WORKSPACE: Pocket Contacts Pro.xcworkspace
  # Default iOS app source (your fork); override via workflow_dispatch or repository_dispatch.
  DEFAULT_IOS_REPO: balukasagatta/Pocket-Contacts-Pro_devops
  DEFAULT_IOS_REF: main

jobs:
  build-and-test:
    name: Build & Test (from iOS repo)
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Resolve iOS source coordinates
        id: src
        run: |
          set -euo pipefail
          # Priority: repository_dispatch payload → workflow_dispatch inputs → defaults
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            REPO='${{ github.event.client_payload.ios_repo }}'
            REF='${{ github.event.client_payload.ios_ref }}'
            SHA='${{ github.event.client_payload.sha }}'
            [ -n "${REF}" ] || REF="${SHA}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REPO='${{ inputs.ios_repo }}'
            REF='${{ inputs.ios_ref }}'
          else
            REPO="${DEFAULT_IOS_REPO}"
            REF="${DEFAULT_IOS_REF}"
          fi
          REPO="${REPO:-$DEFAULT_IOS_REPO}"
          REF="${REF:-$DEFAULT_IOS_REF}"
          # Normalize https://github.com/owner/name(.git) → owner/name
          REPO="$(echo "${REPO}" | sed -E 's#https?://(github\.com|origin\.cursor\.com)/##; s#\.git$##; s#^git/##')"
          echo "ios_repo=${REPO}" >> "$GITHUB_OUTPUT"
          echo "ios_ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "Building artifact from iOS repo: ${REPO}@${REF}"

      - name: Checkout pipeline tooling (pocket-build)
        uses: actions/checkout@v4
        with:
          path: pipeline

      - name: Checkout iOS application source
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.src.outputs.ios_repo }}
          ref: ${{ steps.src.outputs.ios_ref }}
          token: ${{ secrets.IOS_REPO_TOKEN || github.token }}
          path: ios-src
          # Public upstream works with github.token; private pocket-container needs IOS_REPO_TOKEN.

      - name: Overlay CI scheme + Ruby tooling onto iOS tree
        run: |
          set -euo pipefail
          # Shared scheme is required for headless xcodebuild (upstream often lacks it).
          mkdir -p "ios-src/Pocket Contacts Pro.xcodeproj/xcshareddata/xcschemes"
          if [ -f "pipeline/Pocket Contacts Pro.xcodeproj/xcshareddata/xcschemes/Pocket Contacts Pro.xcscheme" ]; then
            cp "pipeline/Pocket Contacts Pro.xcodeproj/xcshareddata/xcschemes/Pocket Contacts Pro.xcscheme" \
               "ios-src/Pocket Contacts Pro.xcodeproj/xcshareddata/xcschemes/"
          fi
          # Prefer pipeline Gemfile / Podfile so CI gets a clean CocoaPods integration.
          cp pipeline/Gemfile ios-src/Gemfile
          [ -f pipeline/Gemfile.lock ] && cp pipeline/Gemfile.lock ios-src/Gemfile.lock || true
          cp pipeline/Podfile ios-src/Podfile
          # Drop stale Pods from the fork (often incomplete / binary leftovers).
          rm -rf ios-src/Pods ios-src/Podfile.lock
          # Record provenance for the artifact
          mkdir -p ios-src/artifacts
          {
            echo "ios_repo=${{ steps.src.outputs.ios_repo }}"
            echo "ios_ref=${{ steps.src.outputs.ios_ref }}"
            echo "triggered_by=${{ github.event_name }}"
            echo "pipeline_sha=${{ github.sha }}"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > ios-src/artifacts/BUILD_INFO.txt
          (cd ios-src && git rev-parse HEAD) >> ios-src/artifacts/BUILD_INFO.txt || true
          cat ios-src/artifacts/BUILD_INFO.txt

      - name: Select Xcode
        working-directory: ios-src
        run: |
          # Prefer newest installed Xcode that has Simulator runtimes.
          for CAND in \
            /Applications/Xcode_16.4.app/Contents/Developer \
            /Applications/Xcode_16.3.app/Contents/Developer \
            /Applications/Xcode_16.2.app/Contents/Developer \
            /Applications/Xcode_16.1.app/Contents/Developer \
            /Applications/Xcode_16.app/Contents/Developer \
            /Applications/Xcode.app/Contents/Developer; do
            if [ -d "${CAND}" ]; then
              sudo xcode-select -s "${CAND}"
              break
            fi
          done
          echo "Using: $(xcode-select -p)"
          xcodebuild -version
          xcodebuild -showsdks
          xcrun simctl list runtimes || true

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ios-src

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
          key: pods-cache-${{ runner.os }}-${{ hashFiles('ios-src/Podfile') }}
          restore-keys: |
            pods-cache-${{ runner.os }}-

      - name: Install CocoaPods dependencies
        id: pods
        working-directory: ios-src
        run: |
          set -euo pipefail
          # This app has no active pods; stale Pods linkage breaks the linker on CI.
          # Deintegrate CocoaPods and build the .xcodeproj directly.
          bundle exec pod deintegrate || true
          rm -rf Pods
          # Drop Pods framework entries / xcconfig base configs that survive deintegrate.
          python3 <<'PY'
          from pathlib import Path
          p = Path("Pocket Contacts Pro.xcodeproj/project.pbxproj")
          text = p.read_text()
          lines = []
          skip_substrings = [
              "Pods_Pocket_Contacts_Pro.framework",
              "Pods-Pocket Contacts Pro.debug.xcconfig",
              "Pods-Pocket Contacts Pro.release.xcconfig",
              "[CP] Check Pods Manifest.lock",
          ]
          for line in text.splitlines(True):
              if any(s in line for s in skip_substrings):
                  continue
              # Clear baseConfigurationReference lines that pointed at Pods xcconfigs
              if "baseConfigurationReference" in line and "Pods" in line:
                  continue
              lines.append(line)
          p.write_text("".join(lines))
          print("Stripped CocoaPods linkage from project.pbxproj")
          PY
          echo "use_workspace=false" >> "$GITHUB_OUTPUT"
          xcodebuild -list -project "Pocket Contacts Pro.xcodeproj"

      - name: List schemes
        working-directory: ios-src
        run: |
          xcodebuild -list -project "Pocket Contacts Pro.xcodeproj"

      - name: Resolve Simulator destination
        id: sim
        working-directory: ios-src
        run: |
          set -euo pipefail
          xcrun simctl list devices available || true
          SHOW_ARGS=(-project "Pocket Contacts Pro.xcodeproj")
          # Prefer an id-based destination from xcodebuild (avoids name/OS:latest mismatches).
          DEST_LINE=$(xcodebuild "${SHOW_ARGS[@]}" -scheme "${SCHEME}" -showdestinations 2>/dev/null \
            | grep 'platform:iOS Simulator' \
            | grep 'id:' \
            | grep -v 'placeholder' \
            | head -1 || true)
          if [ -z "${DEST_LINE}" ]; then
            echo "::error::No usable iOS Simulator destination from xcodebuild -showdestinations"
            xcodebuild "${SHOW_ARGS[@]}" -scheme "${SCHEME}" -showdestinations || true
            exit 1
          fi
          SIM_ID=$(echo "${DEST_LINE}" | sed -n 's/.*id:\([^,}]*\).*/\1/p' | tr -d ' ')
          SIM_NAME=$(echo "${DEST_LINE}" | sed -n 's/.*name:\([^,}]*\).*/\1/p' | sed 's/^ *//;s/ *$//')
          DEST="platform=iOS Simulator,id=${SIM_ID}"
          echo "destination=${DEST}" >> "$GITHUB_OUTPUT"
          echo "device=${SIM_NAME}" >> "$GITHUB_OUTPUT"
          echo "Using destination: ${DEST} (${SIM_NAME})"

      - name: Build (Simulator, unsigned)
        working-directory: ios-src
        run: |
          set -euo pipefail
          mkdir -p artifacts/logs build
          set -o pipefail
          xcodebuild \
            -project "Pocket Contacts Pro.xcodeproj" \
            -scheme "${SCHEME}" \
            -configuration Debug \
            -destination "${{ steps.sim.outputs.destination }}" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=YES \
            build \
            | tee artifacts/logs/xcodebuild-build.log \
            | bundle exec xcpretty --color

      - name: Package Simulator .app artifact
        working-directory: ios-src
        run: |
          set -euo pipefail
          APP_PATH=$(find build/DerivedData/Build/Products -type d -name "Pocket Contacts Pro.app" | head -1)
          if [ -z "${APP_PATH}" ]; then
            echo "::error::Built .app not found under build/DerivedData/Build/Products"
            find build/DerivedData/Build/Products -maxdepth 3 -type d || true
            exit 1
          fi
          echo "Packaging: ${APP_PATH}"
          ditto -c -k --sequesterRsrc --keepParent "${APP_PATH}" \
            "artifacts/PocketContactsPro-simulator.app.zip"
          ls -lh artifacts/PocketContactsPro-simulator.app.zip
          cp artifacts/BUILD_INFO.txt artifacts/BUILD_INFO.txt.bak 2>/dev/null || true


      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketContactsPro-simulator
          path: |
            ios-src/artifacts/PocketContactsPro-simulator.app.zip
            ios-src/artifacts/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ci-logs
          path: ios-src/artifacts/logs/
          if-no-files-found: ignore
          retention-days: 14
